name: Data refresh

# Rebuilds the reference data from the public APIs each month and opens a pull request with
# the change report. Nothing reaches production until a person merges it.
on:
  schedule:
    - cron: "0 4 2 * *"  # 2nd of each month, 04:00 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: Columns to keep from the published files (space separated), e.g. argiles_classe
        required: false
        default: ""
      workers:
        description: Parallel requests for the per-school calls (clay, PPRI)
        required: false
        default: "8"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Bulk mode: the national files are loaded into this throwaway PostGIS database and the
    # indicators computed in SQL (app/pipeline/bulk.py). Nothing in it outlives the job.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: srt
          POSTGRES_PASSWORD: pipeline-password
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srt -d pipeline"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # With the default token, the pull request does not start the CI workflow (GitHub rule).
          # Add a DATA_REFRESH_TOKEN secret (fine-grained PAT: contents + pull requests) to get CI on it.
          token: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - run: pip install -e ".[parquet]" -c requirements-lock.txt
      - name: Rebuild, compare, open or update the pull request
        env:
          PUSH: "1"
          # Departments to build (repository variable: "45", "45,17,74" or "all"). Default: the
          # published académie of Orléans-Tours. A published department left out blocks the PR.
          SRT_DEPARTEMENTS: ${{ vars.SRT_DEPARTEMENTS || '18,28,36,37,41,45' }}
          SRT_PIPELINE_DATABASE_URL: postgresql+psycopg://srt:pipeline-password@127.0.0.1:5432/pipeline
          WORKERS: ${{ github.event.inputs.workers || '8' }}
          KEEP: ${{ github.event.inputs.keep || '' }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN || github.token }}
        run: deploy/data_refresh.sh
      - name: Raw API responses and staged files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-${{ github.run_id }}
          path: data/staging/
          if-no-files-found: ignore
