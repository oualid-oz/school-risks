[project]
name = "school-risk-tracker"
version = "0.1.0"
description = "Track natural and technological risks for the collèges of Loiret."
readme = "README.md"
requires-python = ">=3.12"
# Minimum versions. The exact versions tested and deployed are in requirements-lock.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "PyJWT>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "pandas>=3.0",     # the code relies on pandas 3's "str" dtype
    "httpx>=0.27",
    # Reads data/*.parquet where pyarrow is not installed (Vercel's build step loads the
    # reference data with it): ~20 MB instead of ~170 MB. pandas prefers pyarrow if present.
    "fastparquet>=2024.2",
    # PDF fiche per school (pure Python; with Pillow and fonttools, ~40 MB).
    "fpdf2>=2.8",
    # Error reporting, only active when SENTRY_DSN is set.
    "sentry-sdk>=2.20",
]

[project.optional-dependencies]
# pyarrow: faster parquet reading and writing (data pipeline, SQLite mode). Left out on
# Vercel, where it alone would take ~170 MB of the 500 MB function limit.
parquet = ["pyarrow>=16"]
dev = [
    "school-risk-tracker[parquet]",
    "pytest>=8",
    "ruff>=0.8",
    # Browser tests (tests/e2e); then: python -m playwright install chromium-headless-shell
    "playwright>=1.48",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Vercel (https://vercel.com/docs/frameworks/backend/fastapi). Python version: .python-version
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Runs after the dependencies are installed, before the deployment goes live.
build = "python -m app.manage deploy-check"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["*.json"]
"app" = ["assets/fonts/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults are the intended pattern
    "UP042",  # keep `str, Enum`: StrEnum changes str() output
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated by Alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
