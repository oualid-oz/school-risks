name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.8"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: school_risks_test
          POSTGRES_USER: srt
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srt -d school_risks_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SRT_TEST_DATABASE_URL: postgresql+psycopg://srt:ci-password@127.0.0.1:5432/school_risks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - run: pip install -e ".[dev]" -c requirements-lock.txt
      - name: Tests (SQLite + PostGIS)
        run: pytest -q -rs
      - name: Migrations match the models
        env:
          SRT_DATABASE_URL: ${{ env.SRT_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check

  e2e:
    # The interface in a real browser (Playwright, Chromium) against a real server and PostGIS.
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: school_risks_e2e
          POSTGRES_USER: srt
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srt -d school_risks_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SRT_E2E_DATABASE_URL: postgresql+psycopg://srt:ci-password@127.0.0.1:5432/school_risks_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - run: pip install -e ".[dev]" -c requirements-lock.txt
      - run: python -m playwright install --with-deps chromium-headless-shell
      - name: Browser tests
        run: pytest tests/e2e -q -rs
      - name: Screenshots and server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts/
            tests/e2e/server.log
          if-no-files-found: ignore

  docker:
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    # Job level, not step level: every `docker compose` command (exec, logs, down too)
    # reads the whole compose file and needs the required variables.
    env:
      BUILD_VERSION: ci-${{ github.sha }}
      SRT_DB_PASSWORD: ci-password
      SRT_JWT_SECRET_KEY: ci-only-signing-key-that-is-long-enough-for-hs256
      SRT_BOOTSTRAP_ADMIN_USERNAME: ci-admin
      SRT_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        run: |
          chmod 777 backups
          docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/health/ready
          token=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/token \
            -d username=ci-admin -d password=ci-admin-password | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $token" \
            "http://127.0.0.1:8000/api/v1/colleges/proches?lat=47.9&lon=1.9&rayon_km=5" > /dev/null
          docker compose exec -T backup /bin/sh /backup.sh once
          ls -l backups/*.dump
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
