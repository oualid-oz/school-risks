# Tool configuration only: the app is installed from requirements.txt.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults are the intended pattern
    "UP042",  # keep `str, Enum`: StrEnum changes str() output
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated by Alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
